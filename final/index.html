<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shiur Citation Finder</title>

    <!-- Load our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Shiur Citation Finder</h1>

        <p>
            Upload a transcript to automatically identify and annotate
            Torah sources.
        </p>

        <input
            type="file"
            id="transcriptFile"
            accept=".txt"
        >

        <br><br>

        <button id="analyzeButton">
            Analyze Transcript
        </button>

        <hr>

        <h2>Results</h2>

        <div id="results">

            Results will appear here.

        </div>

    </div>

    <!-- Load our JavaScript -->
    <script src="app.js"></script>

</body>

</html>
